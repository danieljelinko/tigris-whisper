# Benchmark test-set manifest.
# Each [[entry]] defines one (category, length, language, audio, reference) combination.
# Add rows here to benchmark additional categories, lengths, or languages — or use the
# add-benchmark-language skill.
#
# Fields:
#   category     = test-set theme, used to group results in reports (e.g. "general", "software")
#   length       = text length tier: "short" (~50-80 words), "medium" (~100 words), "long" (~1000 words)
#   language     = Whisper language code (ISO 639-1)
#   audio        = path to WAV recording (relative to repo root)
#   reference    = path to ground-truth transcript text file (relative to repo root)
#   label        = human-readable name shown in reports

# ── General (everyday speech — Budapest trip diary) ────────────────────────

