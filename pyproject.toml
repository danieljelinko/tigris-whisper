[project]
name = "tigris-whisper"
version = "0.1.0"
description = "A lightweight Python daemon that records audio from your microphone on a global hot-key, sends it to a Docker-hosted Whisper transcription server, and places the resulting text in your clipboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynput",
    "pyperclip",
    "requests",
    "sounddevice",
    "soundfile",
    "numpy",
    "pyautogui",
    "win10toast; sys_platform == 'win32'",
    "flask>=3.1.3",
    "mlx-whisper; sys_platform == 'darwin'",
    "faster-whisper; sys_platform == 'linux'",
    "jiwer>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
