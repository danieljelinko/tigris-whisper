[workspace]
name = "tigris-whisper"
version = "0.1.0"
description = "Local whisper hotkey daemon for macOS and Linux"
# mlx-audio>=0.4.4 (needed for the nemotron_asr/cohere_asr model families) pulls
# in an mlx version whose osx-arm64 wheels are only built for macOS 14+. Declaring
# the macos floor here tells the uv-based solver to accept those wheels instead of
# defaulting to a macOS 11 floor and rejecting them as no-match.
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }]

[dependencies]
python = "3.12.*"
pip = "*"
ffmpeg = "*"
# av (PyAV) is pulled in transitively by mlx-audio. The PyPI wheel for av 17.x is
# tagged macosx_14_0_arm64, but pixi solves osx-arm64 against the conda-forge
# default floor (macOS 11), so uv rejects the wheel and falls back to building av
# from source, which needs pkg-config + a compiler and breaks the no-Xcode/no-brew
# macOS path. Pulling av from conda-forge instead gives a prebuilt binary (built
# against the ffmpeg above) that satisfies mlx-audio's requirement with no build.
av = "*"

[pypi-dependencies]
pynput = "*"
requests = "*"
sounddevice = "*"
soundfile = "*"
numpy = "*"
flask = ">=3.1.3"
mlx-whisper = "*"
# mlx-audio serves the newer ASR families (Nemotron 3.5, Meta Omnilingual, Cohere
# Transcribe) behind the `mlx_audio` backend; the model is chosen via the catalog.
# Floored at 0.4.4: earlier releases (including 0.2.9, what an unpinned "*" had
# resolved to) don't ship the nemotron_asr/cohere_asr model families at all, so
# those backends fail past the import stage regardless of loader API used.
mlx-audio = ">=0.4.4"
# mlx-whisper pulls numba transitively but leaves it unconstrained. numpy floats
# to 2.5.0, which every modern numba caps below; the resolver then backtracks the
# unpinned numba to 0.53.1 (loose metadata, no osx-arm64/py3.12 wheel) and fails
# building its sdist on Python 3.12. This floor blocks that backtrack so numpy is
# capped to 2.4.x instead and numba resolves to a wheel-shipping 3.12 build.
numba = ">=0.60"
